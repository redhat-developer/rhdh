# add test files to analysis scope
sonar.sources = .
sonar.tests= .

# Include test subdirectories in test scope
sonar.test.inclusions = e2e-tests/**/*, **/*.test.*

# e2e-tests/**, .ci/**, **/*.test.* — test/CI paths, not product source (tests scoped above).
# setup-cluster-free-harness/action.yaml — S6505 false positive on `yarn install` (file-scoped so other workflows stay scanned).
# build/containerfiles/Containerfile — S8431 false positive on digest-pinned FROM (see #5076).
sonar.exclusions = e2e-tests/**/*, .ci/**/*, **/*.test.*, .github/actions/setup-cluster-free-harness/action.yaml, build/containerfiles/Containerfile

# comma delimited path of files to exclude from copy/paste duplicate checking.
# Locale files under packages/app/src/translations/ share the same key maps
# across de/es/fr/it/ja and trip CPD by design. Stale OFS component paths
# from the pre-NFS app were removed with packages/app-legacy.
sonar.cpd.exclusions=packages/app/src/translations/**,packages/app/src/enhancedSharing.ts
