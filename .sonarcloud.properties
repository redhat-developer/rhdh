# add test files to analysis scope
sonar.sources = .
sonar.tests= .

# Include test subdirectories in test scope
sonar.test.inclusions = e2e-tests/**/*, **/*.test.*

# Exclude test and CI infrastructure from source scope
sonar.exclusions = e2e-tests/**/*, .ci/**/*, **/*.test.*

# comma delimited path of files to exclude from copy/paste duplicate checking
sonar.cpd.exclusions=packages/app/src/components/DynamicRoot/DynamicRoot.test.tsx,packages/app/src/components/admin/AdminTabs.test.tsx,packages/app/src/components/catalog/EntityPage/defaultTabs.tsx,e2e-tests/playwright/e2e/audit-log/LogUtils.ts

# TODO remove this when 1.9 is EOL
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S8431
# ignore .rhdh/docker/Dockerfile and docker/Dockerfile from the 1.9 branch
sonar.issue.ignore.multicriteria.e1.resourceKey=**/docker/Dockerfile

# ignore containerfiles in 1.10+
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e2.resourceKey=**/Containerfile

# githubactions:S6505 on the cluster-free harness setup action. The rule wants
# lifecycle scripts disabled on `yarn install`, but the harness backend runs on
# better-sqlite3, which declares `install: prebuild-install || node-gyp rebuild`
# and ships no prebuilt binary, so disabling them leaves the backend unable to
# boot. The line is also the pre-existing root `yarn install` that PR #4967 only
# moved into a composite action, and it matches pr.yaml, bash-e2e-lint.yaml,
# e2e-tests-lint.yaml and rulesync-check.yaml.
# Revisit if the repo ever adopts enableScripts:false plus a dependenciesMeta
# allowlist, which would be a repo-wide change.
sonar.issue.ignore.multicriteria.e3.ruleKey=githubactions:S6505
sonar.issue.ignore.multicriteria.e3.resourceKey=.github/actions/setup-cluster-free-harness/action.yaml
