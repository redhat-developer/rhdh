# Config overlay for the cluster-free local E2E harness (NFS `packages/app`, Tier B).
#
# Layered on top of app-config.yaml and the generated
# dynamic-plugins-root/app-config.dynamic-plugins.yaml to run Playwright E2E
# without an OpenShift/Kubernetes cluster or container images:
#
#   yarn --cwd e2e-tests e2e:local
#
# It enables guest sign-in (the auth backend rejects guest unless a provider is
# configured) and pins the in-memory SQLite database so a single `run` is fully
# self-contained. See docs/e2e-tests/local-e2e-harness.md.
#
# NOTE: test-only. This grants unauthenticated guest access
# (dangerouslyAllowOutsideDevelopment) and must never be layered into a
# production config.
auth:
  environment: development
  providers:
    guest:
      userEntityRef: user:default/guest
      # Required because auth.environment may resolve outside "development" in CI.
      dangerouslyAllowOutsideDevelopment: true

# app-auth 1.2.0 no longer injects Guest in development; auth.providers is not
# frontend-visible. Explicit signInPage is required. packages/app/config.d.ts must
# declare it @visibility frontend so package start does not filter it out.
# Same regression as #5619 (OCP ConfigMaps); see rhdh-plugins #4716.
signInPage: guest

backend:
  database:
    client: better-sqlite3
    connection: ":memory:"

# CI's customized build-info card on the Settings page, exercised by
# plugins/user-settings-info-card.spec.ts.
buildInfo:
  title: "RHDH Build info"
  card:
    TechDocs builder: "local"
    Authentication provider: "Github"
    RBAC: disabled
  overrideBuildInfo: true

# The settings page language toggle only renders with multiple locales
# configured; mirror the CI list (settings.spec.ts switches to French).
i18n:
  locales:
    - en
    - de
    - es
    - fr
    - it
    - ja

# CI opts user settings out of database storage.
userSettings:
  persistence: browser

# CI ingests the guest user ("Guest User", member of team-a) from Keycloak via
# the keycloakOrg provider; off-cluster the same entities come from a local
# file. NOTE: this locations array replaces the base app-config.yaml one (the
# GitHub URL locations), keeping the harness catalog offline and deterministic.
catalog:
  locations:
    # file targets resolve relative to the backend process cwd, which the
    # harness webServer sets to packages/backend.
    - type: file
      target: ../../e2e-tests/local-harness/guest-ownership-entities.yaml
      rules:
        - allow: [User, Group]

# The app (NFS, default) reads `app.extensions` below, mirroring the CI ConfigMap
# (.ci/pipelines/resources/config_map/dynamic-plugins-config.yaml): the home page route
# plus a customized home-page widget layout. RHDH homepage owns `page:homepage`;
# disable community `page:home` so only one Home destination is registered. NFS
# home-page cards are a fixed set of built-in widgets (home-page-widget:homepage/*) —
# arbitrary cards like the old OFS Placeholder/Markdown/JokeCard/Headline mount points
# have no NFS equivalent. The app-defaults dynamic plugin provides the NFS sidebar. See
# home-page-customization.spec.ts and sidebar.spec.ts for the assertions this drives —
# guest-signin-happy-path.spec.ts additionally covers the Search and Starred Catalog
# Entities widgets.
app:
  extensions:
    - page:home: false
    - page:homepage:
        config:
          path: /
          title: Home
    - api:home/visits: true
    - translation:app/homepage-translations
    # app-root-element:home/visit-listener (also enabled in the CI ConfigMap) is
    # deliberately NOT enabled here. It calls VisitsStorageApi.save() — an unguarded
    # backend call — on every route change, which 404s because userSettings.persistence:
    # browser (above) means the backend never loads @backstage/plugin-user-settings-backend.
    # In a production build that 404 is just a background error; under this harness's dev
    # server (backstage-cli package start), the resulting unhandled rejection triggers
    # webpack's react-refresh error overlay, which is a full-screen transparent iframe that
    # then intercepts every click for the rest of the test. api:home/visits above is enough
    # to keep the Top/Recently Visited home-page widgets rendering (just always empty here).
    # The global-header plugin's own default extensions (gh-component:global-header/*,
    # gh-menu-item:global-header/*) are enabled by default — see
    # e2e-tests/local-harness/dynamic-plugins.yaml. Only the wrapper + translation
    # module need explicit enabling here, since they attach to the core `app`
    # plugin rather than being scoped to the global-header plugin itself.
    - app-root-wrapper:app/global-header
    - translation:app/global-header-translations
    # NFS AppLanguageApi reads availableLanguages here — not from i18n.locales above.
    # Without this, UserSettingsLanguageToggle hides itself (languages.length <= 1).
    - api:app/app-language:
        config:
          availableLanguages: [en, de, es, fr, it, ja]
          defaultLanguage: en
    # Backstage 1.54 added home-page-widget:search/search-bar on @backstage/plugin-search.
    # The RHDH homepage plugin already provides home-page-widget:homepage/search-bar; leaving
    # both enabled duplicates the Search input and fails guest-signin-happy-path.spec.ts.
    - home-page-widget:search/search-bar: false
    # customizable: false so `priority` actually governs ordering (with customizable:
    # true, the layout extension keeps the plugin-registration order and ignores
    # priority entirely). Keys match each widget's `params.name` — see
    # rhdh-plugins/workspaces/homepage/plugins/homepage/src/extensions/homePageCards.tsx.
    # Breakpoints mirror app-config.local.yaml / the CI ConfigMap so the default NFS widgets
    # render in a stable layout for home-page-customization.spec.ts.
    - home-page-layout:homepage/dynamic-homepage-layout:
        config:
          customizable: false
          widgetLayout:
            "Red Hat Developer Hub - Explore templates":
              priority: 300
              breakpoints:
                xl:
