homepage:
  # The backend catalog defaults only include the three main sections. Mirror
  # the CI fixture's cards so Guest and homepage tests cover the same widgets.
  defaultWidgets:
    - id: rhdh-onboarding-section
      ref: rhdh-onboarding-section
    - id: rhdh-entity-section
      ref: rhdh-entity-section
    - id: rhdh-template-section
      ref: rhdh-template-section
    - id: quickaccess-card
      ref: quickaccess-card
    - id: search-bar
      ref: search-bar
    - id: featured-docs-card
      ref: featured-docs-card
