# Cluster-free harness plugin set — installed by ./populate.sh via
# install-dynamic-plugins from OCI (quay.io, pulled with skopeo).
#
# Includes the full DPDY catalog, then disables plugins the @cluster-free-capable
# Playwright specs do not exercise (segment, adoption-insights, extensions,
# …). The remaining harness-critical plugins stay enabled via DPDY defaults
# and are documented explicitly below.
#
# Every package below uses `ref://` rather than a hardcoded tag/digest,
# resolved against dynamic-plugins.default.yaml extracted from a catalog-index
# OCI image. Set CATALOG_INDEX_IMAGE (required — see populate.sh and
# docs/e2e-tests/local-e2e-harness.md) before running populate.sh.
#
# Re-run populate.sh after editing this file.
includes:
  - dynamic-plugins.default.yaml
plugins:
  # --- Disabled: not needed off-cluster (avoids env-var / dist-path startup failures) ---

  # Segment analytics — pluginConfig references ${SEGMENT_WRITE_KEY}, ${SEGMENT_TEST_MODE}, …
  - package: ref://backstage-community-plugin-analytics-provider-segment
    enabled: false

  # Scaffolder regex module — not exercised by cluster-free specs
  - package: ref://backstage-community-plugin-scaffolder-backend-module-regex
    enabled: false

  # Adoption Insights stack — analytics + admin routes; needs licensed-users backend in CI
  - package: ref://red-hat-developer-hub-backstage-plugin-adoption-insights
    enabled: false
  - package: ref://red-hat-developer-hub-backstage-plugin-adoption-insights-backend
    enabled: false
  - package: ref://red-hat-developer-hub-backstage-plugin-analytics-module-adoption-insights
    enabled: false

  # Quickstart onboarding panel — not asserted by cluster-free specs
  - package: ref://red-hat-developer-hub-backstage-plugin-quickstart
    enabled: false

  # Extensions stack — not exercised by cluster-free specs.
  - package: ref://red-hat-developer-hub-backstage-plugin-catalog-backend-module-extensions
    enabled: false
  - package: ref://red-hat-developer-hub-backstage-plugin-extensions
    enabled: false
  - package: ref://red-hat-developer-hub-backstage-plugin-extensions-backend
    enabled: false

  # --- Enabled for cluster-free E2E (inherits version + pluginConfig from DPDY) ---

  # Home page widgets (same quay.io/rhdh package the Helm chart / Operator install).
  - package: ref://red-hat-developer-hub-backstage-plugin-homepage
    enabled: true
  # Sign-in page + auth APIs, drawer infra, and SCM integrations (pluginId: 'app').
  # Without app-auth, guest sign-in falls back to upstream's default page (no
  # "Select a sign-in method" heading) — what guest-signin-happy-path and
  # github-happy-path exercise.
  - package: ref://red-hat-developer-hub-backstage-plugin-app-auth
    enabled: true
  - package: ref://red-hat-developer-hub-backstage-plugin-app-defaults
    enabled: true
  - package: ref://red-hat-developer-hub-backstage-plugin-app-integrations
  # Same catalog-selected Guest provider as the Helm and Operator jobs.
  - package: ref://backstage-plugin-auth-backend-module-guest-provider
    enabled: true
  # TechDocs frontend: /docs + Docs sidebar item (plugins/frontend/sidebar.spec.ts).
  - package: ref://backstage-plugin-techdocs
    enabled: true
  # Global header: top bar + profile dropdown (Settings / Sign-out).
  # Enable app-root-wrapper + translation in app-config.local-e2e.yaml
  # (app-root-wrapper:app/global-header, translation:app/global-header-translations).
  - package: ref://red-hat-developer-hub-backstage-plugin-global-header
    enabled: true

  # Core decoupled plugins (loaded from OCI until catalog index includes them)
  - package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-catalog:pr_4450__2.0.8"
    enabled: true
  - package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-catalog-backend:pr_4450__3.9.1"
    enabled: true
  - package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-catalog-backend-module-openapi:pr_4450__0.2.25"
    enabled: true
  - package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-scaffolder:pr_4450__1.38.2"
    enabled: true
  - package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-search:pr_4450__1.7.7"
    enabled: true
  - package: "oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-user-settings:pr_4450__0.9.6"
    enabled: true
