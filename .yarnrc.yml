nodeLinker: node-modules

npmPreapprovedPackages:
  - "@backstage/*"
  - "@red-hat-developer-hub/*"

yarnPath: .yarn/releases/yarn-4.18.1.cjs

# Yarn Berry needs explicit proxy settings in the Fullsend sandbox. On normal
# machines without these environment variables, the empty values disable them.
httpProxy: "${HTTP_PROXY:-}"
httpsProxy: "${HTTPS_PROXY:-}"
