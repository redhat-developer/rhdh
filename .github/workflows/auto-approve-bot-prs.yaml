name: Auto-Approve Bot PRs

# This workflow automatically adds labels and approves PRs that match specific criteria:
# - Created by rhdh-bot, or by rhdh-gh-app[bot] (the RHDH GitHub App token that
#   update-versions.yaml and update-dynamic-plugins-default.yaml push with)
# - Branch name matches specific patterns (base image updates, version bumps, etc.)
# - Adds lgtm and approved labels if not present
#
# pull_request_target runs this file from the *base* branch, so every release-*
# line needs the same debounce. updateBaseImages.sh opens the PR on the first
# image bump and pushes another commit seconds later; Prow then strips lgtm.
# Wait 10s after the triggering commit and skip if HEAD moved. A later
# synchronize run (with cancel-in-progress) applies lgtm 10s after the last push.
# labeled is omitted so adding lgtm/approved does not retrigger this workflow.
#
# lgtm makes the pipeline controller start e2e-ocp-helm. On [skip-e2e] PRs to
# main, rhdh-bot overrides it first (rhdh-ci-overriders team), so no cluster is
# used. Not on release branches: Prow's /override records the main job, which
# the controller does not match to release-branch jobs.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: auto-approve-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: read

jobs:
  auto-approve:
    name: Auto-Approve and Label PRs
    runs-on: ubuntu-latest

    # Only run if PR is from rhdh-bot or the RHDH GitHub App bot. Both are checked
    # because some automation pushes with a PAT (author rhdh-bot) and some with
    # actions/create-github-app-token (author rhdh-gh-app[bot]). The branch
    # allowlist below stays the filter for what may be approved.
    if: |
      contains(fromJSON('["rhdh-bot", "rhdh-gh-app[bot]"]'), github.event.pull_request.user.login)

    steps:
      - name: Check PR eligibility
        id: check-eligibility
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          # Don't auto-approve draft PRs
          if [[ "$PR_DRAFT" == "true" ]]; then
            echo "eligible=false" >> $GITHUB_OUTPUT
            echo "reason=PR is in draft state" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Labels will be added automatically if eligible

          # Define branch patterns that are eligible for auto-approval
          # Add more patterns as needed
          ELIGIBLE_PATTERNS=(
            "^chore/automated-.*"
          )

          ELIGIBLE=false
          for pattern in "${ELIGIBLE_PATTERNS[@]}"; do
            if [[ "$PR_BRANCH" =~ $pattern ]]; then
              ELIGIBLE=true
              break
            fi
          done

          if [[ "$ELIGIBLE" == "true" ]]; then
            echo "eligible=true" >> $GITHUB_OUTPUT
          else
            echo "eligible=false" >> $GITHUB_OUTPUT
          fi

      - name: Wait until HEAD is stable
        id: debounce
        if: steps.check-eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          DEBOUNCE_SECONDS=10
          echo "Waiting ${DEBOUNCE_SECONDS}s after ${EVENT_SHA} so later commits can land and Prow can process synchronize."
          sleep "${DEBOUNCE_SECONDS}"

          CURRENT_SHA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [[ "${CURRENT_SHA}" != "${EVENT_SHA}" ]]; then
            echo "HEAD moved during debounce (${EVENT_SHA} -> ${CURRENT_SHA}); skipping so the newer run can label."
            echo "stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "HEAD unchanged for ${DEBOUNCE_SECONDS}s: ${CURRENT_SHA}"
          echo "stable=true" >> "$GITHUB_OUTPUT"

      # Runs before lgtm is added. On any failure the next step adds lgtm as usual.
      # Only for events rhdh-bot triggered: the sender can't be spoofed, so a
      # human's push, "Update branch" or reopen skips the override.
      - name: Override e2e-ocp-helm for [skip-e2e] PRs
        id: override
        if: >-
          steps.check-eligibility.outputs.eligible == 'true' &&
          steps.debounce.outputs.stable == 'true' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.user.login == 'rhdh-bot' &&
          github.event.sender.login == 'rhdh-bot'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.RHDH_BOT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          CONTEXT: ci/prow/e2e-ocp-helm
        run: |
          set -euo pipefail

          # Case-sensitive, like the in-job [skip-e2e] check.
          if [[ "${PR_TITLE}" != *"[skip-e2e]"* ]]; then
            echo "Title has no [skip-e2e]; nothing to override."
            exit 0
          fi

          # Skip if anyone else's commit is on the branch.
          OTHERS=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            --jq '.[] | select(.author.login != "rhdh-bot" or .committer.login != "rhdh-bot") | .sha')
          if [[ -n "${OTHERS}" ]]; then
            echo "::notice::Commits not from rhdh-bot (${OTHERS//$'\n'/ }); not overriding, so lgtm starts e2e-ocp-helm."
            exit 0
          fi

          state() {
            gh api "repos/${GITHUB_REPOSITORY}/commits/${EVENT_SHA}/statuses" \
              --jq "[.[] | select(.context == \"${CONTEXT}\")][0] | \"\(.state // \"\")|\(.description // \"\")\""
          }

          # The controller marks e2e pending on push; no status means nothing will run.
          STATUS="|"
          for _ in $(seq 1 12); do
            STATUS=$(state)
            [[ "${STATUS%%|*}" != "" ]] && break
            sleep 10
          done
          case "${STATUS%%|*}" in
            "") echo "No ${CONTEXT} status on ${EVENT_SHA}; nothing to override."; exit 0 ;;
            success) echo "${CONTEXT} already green: ${STATUS#*|}"; exit 0 ;;
            *) echo "${CONTEXT} is ${STATUS%%|*}; overriding." ;;
          esac

          GH_TOKEN="${BOT_TOKEN}" gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "/override ${CONTEXT}"
          echo "overridden=true" >> "$GITHUB_OUTPUT"

          for _ in $(seq 1 18); do
            sleep 10
            CURRENT_SHA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
            if [[ "${CURRENT_SHA}" != "${EVENT_SHA}" ]]; then
              # Prow applies /override to the head it sees, which may be this new commit.
              echo "::warning::HEAD moved to ${CURRENT_SHA}; cancelling the override."
              GH_TOKEN="${BOT_TOKEN}" gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "/override-cancel ${CONTEXT}"
              echo "head_moved=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            STATUS=$(state)
            if [[ "${STATUS%%|*}" == "success" ]]; then
              echo "${CONTEXT} on ${EVENT_SHA}: ${STATUS#*|}"
              exit 0
            fi
          done
          echo "::warning::${CONTEXT} not green 3 minutes after /override; lgtm will start it."

      # A new commit can inherit an /override posted for the previous one (Prow
      # applies it to the current head, and the earlier run is usually cancelled
      # by the push). If this run didn't override, cancel it so e2e fails closed.
      - name: Cancel an override this run did not validate
        if: >-
          !cancelled() &&
          github.event.action == 'synchronize' &&
          steps.check-eligibility.outputs.eligible == 'true' &&
          steps.debounce.outputs.stable == 'true' &&
          github.event.pull_request.base.ref == 'main' &&
          steps.override.outputs.overridden != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.RHDH_BOT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          CONTEXT: ci/prow/e2e-ocp-helm
        run: |
          set -euo pipefail
          DESC=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${EVENT_SHA}/statuses" \
            --jq "[.[] | select(.context == \"${CONTEXT}\")][0].description // \"\"")
          if [[ "${DESC}" == "Overridden by"* ]]; then
            echo "::warning::${CONTEXT} on ${EVENT_SHA} was overridden for a previous commit; cancelling."
            GH_TOKEN="${BOT_TOKEN}" gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "/override-cancel ${CONTEXT}"
          fi

      - name: Add required labels and approve PR
        if: >-
          !cancelled() &&
          steps.check-eligibility.outputs.eligible == 'true' &&
          steps.debounce.outputs.stable == 'true' &&
          steps.override.outputs.head_moved != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Add the required labels if not already present
          gh pr edit "$PR_NUMBER" --add-label "lgtm,approved" --repo "$GITHUB_REPOSITORY"

          # Auto-approve the PR
          gh pr review "$PR_NUMBER" \
            --approve \
            --repo "$GITHUB_REPOSITORY" \
            --body "**Auto-Approved**

          This PR has been automatically approved by the auto-approve workflow.

          **Labels Added:** \`lgtm\`, \`approved\`"
