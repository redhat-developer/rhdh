name: Auto-Approve Bot PRs

# This workflow automatically adds labels and approves PRs that match specific criteria:
# - Created by rhdh-bot, or by rhdh-gh-app[bot] (the RHDH GitHub App token that
#   update-versions.yaml and update-dynamic-plugins-default.yaml push with)
# - Branch name matches specific patterns (base image updates, version bumps, etc.)
# - Adds lgtm and approved labels if not present
# - [skip-e2e] PRs from rhdh-bot get skip-e2e instead of lgtm (see the
#   "Mark ci/pipeline-gate" step), so e2e-ocp-helm never starts
#
# pull_request_target runs this file from the *base* branch, so every release-*
# line needs the same debounce. updateBaseImages.sh opens the PR on the first
# image bump and pushes another commit seconds later; Prow then strips lgtm.
# Wait 10s after the triggering commit and skip if HEAD moved. A later
# synchronize run (with cancel-in-progress) applies lgtm 10s after the last push.
# labeled is omitted so adding lgtm/approved does not retrigger this workflow.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: auto-approve-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

jobs:
  auto-approve:
    name: Auto-Approve and Label PRs
    runs-on: ubuntu-latest

    # Only run if PR is from rhdh-bot or the RHDH GitHub App bot. Both are checked
    # because some automation pushes with a PAT (author rhdh-bot) and some with
    # actions/create-github-app-token (author rhdh-gh-app[bot]). The branch
    # allowlist below stays the filter for what may be approved.
    if: |
      contains(fromJSON('["rhdh-bot", "rhdh-gh-app[bot]"]'), github.event.pull_request.user.login)

    steps:
      - name: Check PR eligibility
        id: check-eligibility
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          # Don't auto-approve draft PRs
          if [[ "$PR_DRAFT" == "true" ]]; then
            echo "eligible=false" >> $GITHUB_OUTPUT
            echo "reason=PR is in draft state" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Labels will be added automatically if eligible

          # Define branch patterns that are eligible for auto-approval
          # Add more patterns as needed
          ELIGIBLE_PATTERNS=(
            "^chore/automated-.*"
          )

          ELIGIBLE=false
          for pattern in "${ELIGIBLE_PATTERNS[@]}"; do
            if [[ "$PR_BRANCH" =~ $pattern ]]; then
              ELIGIBLE=true
              break
            fi
          done

          if [[ "$ELIGIBLE" == "true" ]]; then
            echo "eligible=true" >> $GITHUB_OUTPUT
          else
            echo "eligible=false" >> $GITHUB_OUTPUT
          fi

      - name: Wait until HEAD is stable
        id: debounce
        if: steps.check-eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          DEBOUNCE_SECONDS=10
          echo "Waiting ${DEBOUNCE_SECONDS}s after ${EVENT_SHA} so later commits can land and Prow can process synchronize."
          sleep "${DEBOUNCE_SECONDS}"

          CURRENT_SHA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [[ "${CURRENT_SHA}" != "${EVENT_SHA}" ]]; then
            echo "HEAD moved during debounce (${EVENT_SHA} -> ${CURRENT_SHA}); skipping so the newer run can label."
            echo "stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "HEAD unchanged for ${DEBOUNCE_SECONDS}s: ${CURRENT_SHA}"
          echo "stable=true" >> "$GITHUB_OUTPUT"

      # In LGTM mode the OpenShift CI pipeline controller starts e2e-ocp-helm
      # when lgtm is added, and the job claims a cluster before it sees
      # [skip-e2e]. So [skip-e2e] PRs from rhdh-bot do not get lgtm: rhdh-bot
      # marks the required ci/pipeline-gate check green for this HEAD, and the
      # PR gets a skip-e2e label instead, which a Tide query in openshift/release
      # (author rhdh-bot + label skip-e2e) merges on. The command names the HEAD,
      # so the controller rejects it if the PR has moved. If the gate does not
      # turn green, fall back to lgtm: the job then runs and exits on [skip-e2e].
      # rhdh-gh-app[bot] PRs always take the lgtm path; the Tide query only
      # matches rhdh-bot.
      - name: Mark ci/pipeline-gate for [skip-e2e] PRs
        id: skip-e2e
        if: >-
          steps.check-eligibility.outputs.eligible == 'true' &&
          steps.debounce.outputs.stable == 'true' &&
          github.event.pull_request.user.login == 'rhdh-bot' &&
          contains(github.event.pull_request.title, '[skip-e2e]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.RHDH_BOT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gate_conclusion() {
            gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=ci/pipeline-gate" \
              --jq '[.check_runs[] | select(.app.slug == "openshift-merge-bot")][0].conclusion // ""'
          }

          if [[ "$(gate_conclusion)" != "success" ]]; then
            GH_TOKEN="${BOT_TOKEN}" gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "/pipeline mark-pipeline-gate ${HEAD_SHA}"
            for _ in $(seq 1 12); do
              sleep 10
              if [[ "$(gate_conclusion)" == "success" ]]; then
                break
              fi
            done
          fi

          if [[ "$(gate_conclusion)" == "success" ]]; then
            echo "ci/pipeline-gate is green on ${HEAD_SHA}; labelling skip-e2e instead of lgtm."
            echo "gate-marked=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ci/pipeline-gate was not marked within 2 minutes; falling back to lgtm, so e2e-ocp-helm will run and exit on [skip-e2e]."
          fi

      - name: Add required labels and approve PR
        if: steps.check-eligibility.outputs.eligible == 'true' && steps.debounce.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GATE_MARKED: ${{ steps.skip-e2e.outputs.gate-marked }}
        run: |
          # skip-e2e when the pipeline gate was marked above, otherwise lgtm
          MERGE_LABEL="lgtm"
          if [[ "$GATE_MARKED" == "true" ]]; then
            MERGE_LABEL="skip-e2e"
          fi

          # Add the required labels if not already present
          gh pr edit "$PR_NUMBER" --add-label "${MERGE_LABEL},approved" --repo "$GITHUB_REPOSITORY"

          # Auto-approve the PR
          gh pr review "$PR_NUMBER" \
            --approve \
            --repo "$GITHUB_REPOSITORY" \
            --body "**Auto-Approved**

          This PR has been automatically approved by the auto-approve workflow.

          **Labels Added:** \`${MERGE_LABEL}\`, \`approved\`"
