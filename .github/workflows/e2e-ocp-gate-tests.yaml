name: E2E OCP Gate Tests

on:
  pull_request:
    paths:
      - "scripts/e2e-gate/**"
      - ".github/workflows/e2e-ocp-gate-tests.yaml"

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"

      - name: Run gate rule tests
        run: node --test "scripts/e2e-gate/*.test.mts"
