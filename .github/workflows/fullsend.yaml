# Based on fullsend scaffold; customized for RHDH:
# - /fs-code on open Backstage upgrade issues (existing)
# - /fs-cve-pr-review on PRs (CVE dependency-bump assessment; forks allowed)
# Upstream: https://github.com/fullsend-ai/fullsend/blob/main/internal/scaffold/fullsend-repo/templates/shim-per-repo.yaml
---
# fullsend shim workflow (per-repo installation mode)
# Routes events to agent workflows via reusable-dispatch.yml.
# All agent execution happens in this repo's context — no external
# config repo is needed.
#
# Routing: this shim forwards the raw event context to reusable-dispatch.yml,
# which determines the stage and runs the agent inline (ADR 62).
# Adding a new stage requires only a job in reusable-dispatch.yml — zero changes to this repo.
#
# Concurrency: per-role cancel-in-progress groups live in reusable-dispatch.yml
# stage jobs with -agent- suffix. Roles operate independently (#2452).
#
# Comment triggers load .fullsend/ from the default branch (main). No
# pull_request_target / cve-fix label path in this install.
name: fullsend

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  dispatch:
    if: >-
      github.event_name == 'issue_comment'
      && github.event.comment.user.type != 'Bot'
      && (
        (
          github.event.issue.pull_request == null
          && github.event.issue.state == 'open'
          && contains(github.event.issue.labels.*.name, 'backstage-upgrade-automation')
          && github.event.comment.body == '/fs-code'
        )
        || (
          github.event.issue.pull_request != null
          && startsWith(github.event.comment.body, '/fs-cve-pr-review')
        )
      )
    permissions:
      actions: write
      id-token: write
      contents: write
      issues: write
      packages: read
      pull-requests: write
    uses: fullsend-ai/fullsend/.github/workflows/reusable-dispatch.yml@d5f36921ac754705619f38c637ef692873809fbc # v0.43.0
    with:
      event_action: ${{ github.event.action }}
      install_mode: per-repo
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      project_number: ${{ vars.FULLSEND_PROJECT_NUMBER }}
      runner_image: ubuntu-24.04
    secrets:
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      # Repo secrets use FULLSEND_* names; v0.43 dispatch still expects JIRA_*.
      JIRA_TOKEN: ${{ secrets.FULLSEND_JIRA_TOKEN }}
      JIRA_USER_EMAIL: ${{ secrets.FULLSEND_JIRA_EMAIL }}
