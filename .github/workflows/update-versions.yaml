name: Update versions.md in Dynamic Plugins Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'release-[0-9]+.[0-9]+'
    paths:
      - "backstage.json"
      - "packages/app/package.json"
      - "packages/backend/package.json"

jobs:
  update-versions-md:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Run update-versions-doc script
        run: node scripts/update-versions-doc.mjs docs/dynamic-plugins/versions.md "${{ github.ref_name }}"
        # Note: GITHUB_REPOSITORY is available as a default env var in the github runner

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          # RHDH_BOT_TOKEN (rhdh-bot PAT) rather than the RHDH GitHub App token, so the
          # PR is authored by rhdh-bot and matches the auto-approve-bot-prs.yaml gate.
          # Same secret update-rpm-lockfile.yaml uses.
          token: ${{ secrets.RHDH_BOT_TOKEN }}
          commit-message: "chore(docs): Update versions.md in dynamic plugin documentation"
          branch: chore/automated-update-versions-doc-${{ github.ref_name }}
          title: "chore(docs): [${{ github.ref_name }}] Update versions.md in dynamic plugin documentation"
          body: |
            This PR updates the Version Compatibility Matrix in *docs/dynamic-plugins/versions.md*
            from the versions in `backstage.json`, `packages/app/package.json` and
            `packages/backend/package.json` on ${{ github.ref_name }}.

            Content is generated by
            https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/scripts/update-versions-doc.mjs

            Auto-generated by workflow: *${{ github.workflow }}*
          labels: "documentation"
          author: "rhdh-bot <rhdh-bot@redhat.com>"
          committer: "rhdh-bot <rhdh-bot@redhat.com>"
          signoff: true
          delete-branch: true
