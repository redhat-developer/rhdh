name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - release-1.9
      - release-1.1[0-9]

env:
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
  TURBO_SCM_HEAD: ${{ github.sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Image and Relevant Changes
        id: check-image
        uses: ./.github/actions/check-image-and-changes

      - name: Detect Backstage bump
        id: bump
        uses: ./.github/actions/detect-backstage-bump

      - name: Setup Node.js
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: "https://registry.npmjs.org"

      - name: Setup local Turbo cache
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        uses: dtinth/setup-github-actions-caching-for-turbo@cc723b4600e40a6b8815b65701d8614b91e2669e # v1
        with:
          cache-prefix: turbogha-pr-${{ github.event.number }}

      - name: Use app-config.example.yaml
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        run: rm app-config.yaml && mv app-config.example.yaml app-config.yaml

      - name: Install dependencies
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        uses: backstage/actions/yarn-install@b3c1841fd69e1658ac631afafd0fb140a2309024 # v0.6.17
        with:
          cache-prefix: ${{ runner.os }}-v${{ matrix.node-version }}

      # A Backstage bump can break packages that turbo does not see as affected.
      - name: Build packages
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        env:
          AFFECTED_FLAG: ${{ steps.bump.outputs.affected_flag }}
        run: yarn run build --continue ${AFFECTED_FLAG:+"$AFFECTED_FLAG"}

  test:
    name: Test with Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Image and Relevant Changes
        id: check-image
        uses: ./.github/actions/check-image-and-changes

      - name: Detect Backstage bump
        id: bump
        uses: ./.github/actions/detect-backstage-bump

      - name: Setup Node.js
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: "https://registry.npmjs.org"

      - name: Setup local Turbo cache
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        uses: dtinth/setup-github-actions-caching-for-turbo@cc723b4600e40a6b8815b65701d8614b91e2669e # v1
        with:
          cache-prefix: turbogha-pr-${{ github.event.number }}

      - name: Use app-config.example.yaml
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        run: rm app-config.yaml && mv app-config.example.yaml app-config.yaml

      - name: Install dependencies
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        uses: backstage/actions/yarn-install@b3c1841fd69e1658ac631afafd0fb140a2309024 # v0.6.17
        with:
          cache-prefix: ${{ runner.os }}-v${{ matrix.node-version }}

      - name: Install Python dependencies
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        run: | 
          pip install -r python/requirements-dev.txt
          pip install -r python/requirements-build.txt
          pip install -r python/requirements.txt

      - name: Run prettier
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        run: yarn prettier:check --continue --affected

      - name: Run lint
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        run: yarn run lint:check --continue --affected

      - name: Run monorepo tools
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        run: yarn run monorepo:check

      - name: Regenerate dockerfiles
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        run: |
          yarn run build:dockerfile; if [[ $(git diff --name-only | grep Dockerfile || true) != "" ]]; then \
            echo "ERROR: Workspace is dirty! Must run 'yarn build:dockerfile' and commit changes!"; exit 1; \
          fi

      - name: Run tests
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        env:
          AFFECTED_FLAG: ${{ steps.bump.outputs.affected_flag }}
        run: yarn run test --continue ${AFFECTED_FLAG:+"$AFFECTED_FLAG"}

      - name: Run Python tests
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        run: pytest docker/test_install-dynamic-plugins.py -v

      - name: Change directory to dynamic-plugins
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        run: cd ./dynamic-plugins

      - name: Install dynamic plugin dependencies
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        run: yarn install

      - name: Test the dynamic plugin wrappers
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        run: yarn test --continue --affected

      - name: Export the dynamic plugin wrappers
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        run: yarn export-dynamic --continue --affected

  backstage-bump-checks:
    name: Backstage bump checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Backstage bump
        id: bump
        uses: ./.github/actions/detect-backstage-bump

      - name: Setup Node.js
        if: ${{ steps.bump.outputs.run_bump_checks == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: ${{ steps.bump.outputs.run_bump_checks == 'true' }}
        uses: backstage/actions/yarn-install@b3c1841fd69e1658ac631afafd0fb140a2309024 # v0.6.17
        with:
          cache-prefix: ${{ runner.os }}-${{ hashFiles('.nvmrc') }}

      - name: Run bump check unit tests
        if: ${{ steps.bump.outputs.run_bump_checks == 'true' }}
        run: node --test scripts/backstage-bump-check/lib.test.mjs

      - name: Snapshot PR dependencies
        if: ${{ steps.bump.outputs.run_bump_checks == 'true' }}
        run: node scripts/backstage-bump-check/index.mjs snapshot "$RUNNER_TEMP/bump/head"

      # First parent of the merge commit, as its own worktree outside the
      # workspace. See scripts/backstage-bump-check/README.md.
      - name: Snapshot base branch
        if: ${{ steps.bump.outputs.run_bump_checks == 'true' }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git rev-parse -q --verify HEAD^2 > /dev/null; then
            BASE_TREE=$(git rev-parse HEAD^1)
          else
            BASE_TREE="$PR_BASE_SHA"
          fi
          echo "Base snapshot from $BASE_TREE"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_TREE"
          cd "$RUNNER_TEMP/base"
          # Only .d.ts files and config:check are needed; skip dependency scripts.
          yarn install --immutable --mode=skip-build
          node "$GITHUB_WORKSPACE/scripts/backstage-bump-check/index.mjs" snapshot "$RUNNER_TEMP/bump/base"

      - name: Compare snapshots
        if: ${{ steps.bump.outputs.run_bump_checks == 'true' }}
        run: node scripts/backstage-bump-check/index.mjs compare "$RUNNER_TEMP/bump/base" "$RUNNER_TEMP/bump/head" "$RUNNER_TEMP/bump/report"

      - name: Upload bump report
        if: ${{ steps.bump.outputs.run_bump_checks == 'true' && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backstage-bump-report
          path: ${{ runner.temp }}/bump/report
          if-no-files-found: ignore
