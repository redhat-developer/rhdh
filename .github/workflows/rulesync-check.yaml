name: AI Assistant Rulesync

on:
  pull_request:
    paths:
      - '.rulesync/**'
      - '.cursor/**'
      - '.cursorignore'
      - '.claude/**'
      - '.opencode/**'
      - 'opencode.jsonc'
      - 'rulesync.jsonc'
      - '.rulesyncignore'
      - '.lintstagedrc.cjs'
      - 'package.json'
      - 'yarn.lock'
  push:
    branches:
      - 'main'
      - 'release-[0-9]+.[0-9]+'
    paths:
      - '.rulesync/**'
      - '.cursor/**'
      - '.cursorignore'
      - '.claude/**'
      - '.opencode/**'
      - 'opencode.jsonc'
      - 'rulesync.jsonc'
      - '.rulesyncignore'
      - '.lintstagedrc.cjs'
      - 'package.json'
      - 'yarn.lock'

jobs:
  rulesync:
    name: Generate and check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: yarn install

      - name: Check rulesync configuration and generated files
        run: yarn rulesync:check
