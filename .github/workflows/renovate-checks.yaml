name: PR Renovate Config Validator

on:
  pull_request:
    paths:
      - '.github/renovate.json'
    # Renovate always uses the config from the repository default branch
    # https://docs.renovatebot.com/configuration-options/
    branches: [ 'main' ]

permissions:
  contents: read

jobs:
  renovate-config-validator:
    runs-on: ubuntu-latest
    name: Renovate Config Validator
    # Avoids npx lifecycle scripts (Sonar S6505). tag@digest so Renovate can bump both.
    container:
      image: ghcr.io/renovatebot/renovate:44.198.3@sha256:bf344aa39d5b592ec728e1db5c3e1d940a5093a89a4598073efcb18d592d121c # 44.145.1
      # Match GitHub-hosted runner UID so actions/checkout can write to /__w/_temp
      # https://github.com/renovatebot/github-action/blob/main/.github/workflows/build.yml
      options: --user 1001:0 --group-add 1000 --group-add 12021 --group-add 127
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate config
        # See https://docs.renovatebot.com/config-validation/
        run: renovate-config-validator --strict .github/renovate.json
