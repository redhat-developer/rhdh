name: PR Build Image (Hermetic)

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.event.pull_request.head.ref }}
  cancel-in-progress: true

env:
  REGISTRY: quay.io
  # Forks: set repo variable QUAY_PR_IMAGE_REPO to your own Quay repo (namespace/repo)
  # and secrets RHDH_PR_BOT_USER/RHDH_PR_BOT_TOKEN scoped to that namespace (not rhdh-community).
  # See CONTRIBUTING.md ("Testing image builds from a fork").
  REGISTRY_IMAGE: ${{ vars.QUAY_PR_IMAGE_REPO || 'rhdh-community/rhdh-pr' }}

jobs:
  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Guard against pushing to shared repo from a fork
        if: github.repository != 'redhat-developer/rhdh' && startsWith(env.REGISTRY_IMAGE, 'rhdh-community/')
        run: |
          echo "::error::Forks must set repository variable QUAY_PR_IMAGE_REPO to a Quay repo outside the rhdh-community namespace."
          exit 1

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Image and Relevant Changes
        id: check-image
        uses: ./.github/actions/check-image-and-changes

      - name: Debug outputs
        env:
          IMAGE_EXISTS: ${{ steps.check-image.outputs.image_exists }}
          RELEVANT_CHANGES: ${{ steps.check-image.outputs.relevant_changes }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          echo "Image exists: $IMAGE_EXISTS"
          echo "Relevant changes: $RELEVANT_CHANGES"
          echo "SHORT_SHA: $SHORT_SHA"
          echo "PR Number: $PR_NUMBER"
          echo "Registry image: $REGISTRY_IMAGE"
          echo "Base Tag: pr-$PR_NUMBER"
          echo "Commit Tag: pr-$PR_NUMBER-$SHORT_SHA"

      - name: Check PR bot credentials
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        env:
          HAS_PR_BOT_AUTH: ${{ secrets.RHDH_PR_BOT_USER != '' && secrets.RHDH_PR_BOT_TOKEN != '' }}
        run: |
          if [ "$HAS_PR_BOT_AUTH" != "true" ]; then
            echo "::error::Missing RHDH_PR_BOT_USER or RHDH_PR_BOT_TOKEN secrets"
            exit 1
          fi

      - name: Get the latest commits from base branch
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        run: |
          git remote add base-origin https://github.com/"$GITHUB_REPOSITORY" || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Updating PR with latest commits from $GITHUB_BASE_REF ..."
          git fetch base-origin "$GITHUB_BASE_REF"
          git merge --no-edit base-origin/"$GITHUB_BASE_REF"

      - name: Build Image (Hermetic)
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        id: build-image
        uses: ./.github/actions/docker-build
        with:
          imageName: ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}
          imageTags: |
            pr-${{ github.event.number }}
            pr-${{ github.event.number }}-${{ env.SHORT_SHA }}
          imageLabels: quay.expires-after=14d
          platform: linux/amd64
          skipArtifactUpload: true

      - name: Push Image to Registry
        if: ${{ steps.check-image.outputs.is_skipped != 'true' }}
        id: push-image
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2.8
        with:
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}:pr-${{ github.event.number }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}:pr-${{ github.event.number }}-${{ env.SHORT_SHA }}
          username: ${{ secrets.RHDH_PR_BOT_USER }}
          password: ${{ secrets.RHDH_PR_BOT_TOKEN }}

      - name: Comment skip status
        if: ${{ success() && steps.check-image.outputs.is_skipped == 'true' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ github.event.number }}
          BUILD_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const prNumber = process.env.PR_NUMBER;
            const buildUrl = process.env.BUILD_WORKFLOW_URL;

            const body = `The container image [build workflow](${buildUrl}) was skipped (either due to [skip-build] tag or no relevant changes with existing image).\n`;

            github.rest.issues.createComment({
              issue_number: parseInt(prNumber),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Comment the image pull link
        if: ${{ success() && steps.check-image.outputs.is_skipped != 'true' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ github.event.number }}
          IMAGE_TAG_PR: ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}:pr-${{ github.event.number }}
          IMAGE_TAG_SHA: ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}:pr-${{ github.event.number }}-${{ env.SHORT_SHA }}
          BUILD_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const prNumber = process.env.PR_NUMBER;
            const buildUrl = process.env.BUILD_WORKFLOW_URL;
            const tags = [process.env.IMAGE_TAG_PR, process.env.IMAGE_TAG_SHA].filter(Boolean);

            const tagLinks = tags.map(fullTag => {
              return `* [\`${fullTag}\`](https://${fullTag})`;
            }).join('\n');

            const body = `Image was [built and published](${buildUrl}) successfully. It is available at:\n\n${tagLinks}\n`;

            github.rest.issues.createComment({
              issue_number: parseInt(prNumber),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Comment build failure
        if: ${{ failure() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ github.event.number }}
          BUILD_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const prNumber = process.env.PR_NUMBER;
            const buildUrl = process.env.BUILD_WORKFLOW_URL;

            const body = `The container image [build workflow](${buildUrl}) finished with status: \`failure\`.\n\n`;

            github.rest.issues.createComment({
              issue_number: parseInt(prNumber),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
