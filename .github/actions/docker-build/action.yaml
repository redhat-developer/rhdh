name: Docker Build
description: Docker Build
inputs:
  imageName:
    description: The full image name including registry (e.g., quay.io/rhdh-community/rhdh)
    required: true
  imageTags:
    description: The tags to apply to the image
    required: true
  imageLabels:
    description: The labels for the Docker image
    required: false
  platform:
    description: "Target given CPU platform architecture (default: linux/amd64)"
    required: false
    default: linux/amd64
  componentDirectory:
    description: Path to the component directory for hermetic builds
    required: false
    default: '.'
  containerfilePath:
    description: Path to the Containerfile to use
    required: false
    default: 'build/containerfiles/Containerfile'
  skipArtifactUpload:
    description: Skip uploading the built image as a GitHub artifact
    required: false
    default: 'false'
  prefetchedCacheDir:
    description: >
      If set, skip hermeto entirely and reuse this cache (must already include
      output/ plus cachi2.env from fetch-deps + generate-env + inject-files on
      amd64). Used by multi-arch builds so arm runners never pull hermeto:latest.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: false
        swap-storage: false

    - name: Extract metadata (tags, labels, annotations) for Docker
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
      with:
        images: ${{ inputs.imageName }}
        tags: |
          ${{ inputs.imageTags }}
        labels: |
          ${{ inputs.imageLabels }}

    # Hermetic Build Steps
    - name: Set up hermetic build variables
      shell: bash
      env:
        COMPONENT_DIR: ${{ inputs.componentDirectory }}
        PREFETCHED_CACHE_DIR: ${{ inputs.prefetchedCacheDir }}
      run: |
        echo "HERMETO_IMAGE=quay.io/konflux-ci/hermeto:latest" >> $GITHUB_ENV
        if [ -n "$PREFETCHED_CACHE_DIR" ]; then
          echo "LOCAL_CACHE_DIR=$PREFETCHED_CACHE_DIR" >> $GITHUB_ENV
        else
          echo "LOCAL_CACHE_DIR=./hermeto-cache/$(basename "$COMPONENT_DIR")" >> $GITHUB_ENV
        fi
        echo "COMPONENT_ABS_DIR=${GITHUB_WORKSPACE}/${COMPONENT_DIR}" >> $GITHUB_ENV

    - name: Cache dependencies with hermeto
      shell: bash
      env:
        PREFETCHED_CACHE_DIR: ${{ inputs.prefetchedCacheDir }}
      run: |        
        set -euo pipefail

        mkdir -p "${LOCAL_CACHE_DIR}"
        # Absolute bind mount — a relative path is treated as a podman named volume.
        CACHE_ABS="$(cd "${LOCAL_CACHE_DIR}" && pwd)"

        if [ -n "$PREFETCHED_CACHE_DIR" ]; then
          # Multi-arch path: hermeto already ran on amd64 (fetch + generate-env + inject).
          echo "::group::Using prefetched hermeto cache"
          if [ ! -d "${LOCAL_CACHE_DIR}/output" ]; then
            echo "::error::prefetchedCacheDir '$LOCAL_CACHE_DIR' has no output/"
            exit 1
          fi
          if [ ! -f "${LOCAL_CACHE_DIR}/cachi2.env" ]; then
            echo "::error::prefetchedCacheDir '$LOCAL_CACHE_DIR' has no cachi2.env (prefetch must run generate-env)"
            exit 1
          fi
          ls -la "$LOCAL_CACHE_DIR"
          echo "::endgroup::"
          echo LOCAL_CACHE_DIR_REALPATH="$CACHE_ABS" >> $GITHUB_ENV
          exit 0
        fi

        if [ "$(uname -m)" = "aarch64" ] || [ "$(uname -m)" = "arm64" ]; then
          echo "::error::hermeto cannot run on arm (image is amd64-only; yarn under qemu SIGSEGVs). Prefetch on amd64 and pass prefetchedCacheDir."
          exit 1
        fi

        # hermeto:latest is linux/amd64-only; pin platform (no-op on amd64 hosts).
        HERMETO_PODMAN=(podman run --rm --platform linux/amd64 \
          -v "$PWD:/source:z" -v "$CACHE_ABS:/cachi2:z" -w /source "$HERMETO_IMAGE")

        echo "::group::Fetching dependencies with hermeto"
        "${HERMETO_PODMAN[@]}" \
          --log-level DEBUG \
          fetch-deps --dev-package-managers \
          --source . \
          --output /cachi2/output \
          '[{"type": "rpm", "path": "."}, {"type": "yarn","path": "."}, {"type": "pip","path": "./python", "allow_binary": "false"}]'
        echo "::endgroup::"

        if [ ! -d "${LOCAL_CACHE_DIR}/output" ]; then
          echo "::error::No hermeto output directory at ${LOCAL_CACHE_DIR}/output"
          exit 1
        fi

        echo "::group::Generating environment file"
        "${HERMETO_PODMAN[@]}" \
          --log-level DEBUG \
          generate-env --format env \
          --output /cachi2/cachi2.env /cachi2/output
        echo "::endgroup::"

        echo "::group::Injecting files"
        "${HERMETO_PODMAN[@]}" \
          --log-level DEBUG \
          inject-files /cachi2/output
        echo "::endgroup::"

        echo LOCAL_CACHE_DIR_REALPATH="$CACHE_ABS" >> $GITHUB_ENV

    - name: "Fix Cache Ownership for Non-Root Buildah"
      shell: bash
      run: |
        set -ex
        echo "::group::Fixing cache ownership"

        echo "=== Before ownership fix ==="
        ls -l ${{ env.LOCAL_CACHE_DIR_REALPATH }}

        echo "=== Attempting to fix ownership to runner user ==="
        sudo chown -R runner ${{ env.LOCAL_CACHE_DIR_REALPATH }}
        
        echo "=== After ownership fix ==="
        ls -l ${{ env.LOCAL_CACHE_DIR_REALPATH }}

        echo "::endgroup::"
        
    - name: Transform Containerfile for hermetic build
      shell: bash
      id: transform-containerfile
      env:
        CONTAINERFILE_PATH: ${{ inputs.containerfilePath }}
        TRANSFORMED_CONTAINERFILE: ${{ inputs.containerfilePath }}.hermeto
      run: |
        set -x
        
        echo "::group::Transforming Containerfile for hermetic build"
        
        # Copy original dockerfile for hermetic build modifications
        cp "$CONTAINERFILE_PATH" "$TRANSFORMED_CONTAINERFILE"
        
        # Transform the dockerfile to simulate Konflux build
        # Configure dnf to use the cachi2 repo (supports both x86_64 and aarch64)
        sed -i '/RUN *\(dnf\|microdnf\) install/i RUN rm -r /etc/yum.repos.d/* && cp /cachi2/output/deps/rpm/$(uname -m)/repos.d/hermeto.repo /etc/yum.repos.d/' "$TRANSFORMED_CONTAINERFILE"
        
        # Inject the cachi2 env variables to every RUN command
        sed -i 's/^\s*RUN /RUN . \/cachi2\/cachi2.env \&\& /' "$TRANSFORMED_CONTAINERFILE"
        echo "::endgroup::"
        
        echo "transformed_containerfile=$TRANSFORMED_CONTAINERFILE" >> $GITHUB_OUTPUT

    # Pre-pull digest-pinned base images with retries. Hermetic buildah uses
    # --network=none, so bases must already be local. Quay CDN/S3 EOFs during
    # the initial pull have caused buildah exit 125 in CI.
    - name: Pre-pull base images with retries
      shell: bash
      env:
        CONTAINERFILE_PATH: ${{ inputs.containerfilePath }}
      run: |
        set -euo pipefail
        MAX_ATTEMPTS=3
        mapfile -t BASE_IMAGES < <(
          # awk takes the first non-flag token after FROM, skipping --platform=...
          grep -E '^FROM[[:space:]]+[^[:space:]]+' "$CONTAINERFILE_PATH" \
            | awk '{for(i=2;i<=NF;i++) if($i !~ /^-/){print $i; next}}' \
            | grep -E '^[^/]+(/[^/]+)+' \
            | grep -vE '^(skeleton|deps|build|cleanup|runner)$' \
            | sort -u
        )
        if [ "${#BASE_IMAGES[@]}" -eq 0 ]; then
          echo "No registry base images found to pre-pull"
          exit 0
        fi
        for image in "${BASE_IMAGES[@]}"; do
          echo "::group::Pre-pull $image"
          attempt=1
          until podman pull "$image"; do
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::Failed to pull $image after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "Pull failed (attempt $attempt/$MAX_ATTEMPTS); retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done
          echo "::endgroup::"
        done

    - name: "Build Docker Image"
      id: build
      uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2.13
      with:
        containerfiles: ${{ steps.transform-containerfile.outputs.transformed_containerfile }}
        context: .
        platform: ${{ inputs.platform }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        extra-args: |
          --network=none
          --volume ${{ env.LOCAL_CACHE_DIR_REALPATH }}:/cachi2:z

    - name: Save image as artifact
      if: ${{ inputs.skipArtifactUpload != 'true' }}
      shell: bash
      env:
        TAGS_LIST: ${{ steps.meta.outputs.tags }} # Extract the built image tags from the metadata

      run: |
        echo "::group::Saving image and metadata for artifact"
        mkdir -p ./rhdh-podman-artifacts

        
        # Save all the built images to tar (podman save can handle multiple tags)
        echo "Saving images with tags:"
        echo "$TAGS_LIST"
        
        podman save $TAGS_LIST -o ./rhdh-podman-artifacts/image.tar
        
        # Save metadata for the push workflow
        echo "$TAGS_LIST" > ./rhdh-podman-artifacts/tags.txt
        echo "::endgroup::"

    - name: Upload image artifact
      if: ${{ inputs.skipArtifactUpload != 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: podman-image-${{ github.event.number || github.ref_name }}-${{ env.SHORT_SHA }}
        path: ./rhdh-podman-artifacts/
        retention-days: 1
        if-no-files-found: error
