name: "Resolve catalog index image"
description: "Resolves quay.io/rhdh/plugin-catalog-index from branch (next or release-*), the catalog-index.lock pin, or an override input"

inputs:
  branch:
    description: "Branch to derive the index tag from (release-* -> version tag, else next)"
    required: true
  catalog_index_image:
    description: "Optional full image override (validated before use)"
    required: false
    default: ""
  pinned:
    description: "Use the digest pinned in e2e-tests/local-harness/catalog-index.lock instead of the floating tag"
    required: false
    default: "false"

outputs:
  image:
    description: "Resolved catalog index image reference"
    value: ${{ steps.resolve.outputs.image }}

runs:
  using: "composite"
  steps:
    - name: Resolve the catalog index image
      id: resolve
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        OVERRIDE: ${{ inputs.catalog_index_image }}
        PINNED: ${{ inputs.pinned }}
      run: |
        case "$PINNED" in
          true) pin_flag="--pinned" ;;
          false) pin_flag="" ;;
          *) echo "pinned must be 'true' or 'false', got: ${PINNED}" >&2; exit 1 ;;
        esac
        image="$(./e2e-tests/local-harness/resolve-catalog-index-image.sh "$BRANCH" "$OVERRIDE" "$pin_flag")"
        echo "image=${image}" >> "$GITHUB_OUTPUT"
        # Record the digest, so a floating-tag run (plugin-sanity) can be traced
        # back to the exact index it validated; a pinned run just echoes its pin.
        digest=$(skopeo inspect --no-creds --override-os linux --override-arch amd64 \
          --format '{{.Digest}}' "docker://${image}" 2> /dev/null || echo "unresolved")
        echo "Catalog index: ${image} (${digest})"
        echo "Catalog index: \`${image}\` @ \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"
