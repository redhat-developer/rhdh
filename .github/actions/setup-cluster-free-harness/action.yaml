name: "Set up cluster-free E2E harness"
description: "Installs the toolchain and workspace dependencies the cluster-free E2E harnesses need (Node, yarn, skopeo)"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version-file: ".nvmrc"

    - name: Enable Corepack (vendored yarn 4)
      shell: bash
      run: corepack enable

    # Keyed per job: both cluster-free jobs run in parallel and would otherwise
    # race to reserve the same cache entry.
    - name: Cache yarn global cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.yarn/berry/cache
        key: yarn-${{ github.job }}-${{ hashFiles('yarn.lock', 'e2e-tests/yarn.lock') }}
        restore-keys: |
          yarn-${{ github.job }}-
          yarn-

    # The Playwright image ships neither: skopeo pulls the plugin images and
    # catalog-index-refs.sh parses the index manifest with jq.
    - name: Install skopeo and jq
      shell: bash
      run: |
        apt-get update
        apt-get install -y --no-install-recommends skopeo jq

    # Both harnesses boot packages/backend from source, which needs the ROOT
    # workspace dependencies; e2e-tests has its own lockfile.
    #
    # Lifecycle scripts stay enabled here (unlike the e2e-tests install below).
    # The harness backend runs on better-sqlite3, whose native binding is
    # fetched by its install script, so --mode=skip-build would leave the
    # backend unable to boot. Same plain `yarn install` the other workflows use.
    - name: Install dependencies (root)
      shell: bash
      run: yarn install

    # skip-build skips the postinstall `playwright install chromium`: the
    # Playwright container already ships the browsers.
    - name: Install dependencies (e2e-tests)
      shell: bash
      working-directory: ./e2e-tests
      run: yarn install --mode=skip-build
