name: "Set up cluster-free E2E harness"
description: "Installs the toolchain and workspace dependencies the cluster-free E2E harnesses need (Node, yarn, skopeo)"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version-file: ".nvmrc"

    - name: Enable Corepack (vendored yarn 4)
      shell: bash
      run: corepack enable

    # Keyed per job: both cluster-free jobs run in parallel and would otherwise
    # race to reserve the same cache entry.
    - name: Cache yarn global cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.yarn/berry/cache
        key: yarn-${{ github.job }}-${{ hashFiles('yarn.lock', 'e2e-tests/yarn.lock') }}
        restore-keys: |
          yarn-${{ github.job }}-
          yarn-

    # The Playwright image ships neither: skopeo pulls the plugin images and
    # catalog-index-refs.sh parses the index manifest with jq.
    - name: Install skopeo, jq, and native build tools
      shell: bash
      run: |
        apt-get update
        apt-get install -y --no-install-recommends skopeo jq build-essential python3

    # Both harnesses boot packages/backend from source, which needs the ROOT
    # workspace dependencies; e2e-tests has its own lockfile.
    - name: Install dependencies (root)
      shell: bash
      run: yarn install

    - name: Install dependencies (e2e-tests)
      shell: bash
      working-directory: ./e2e-tests
      run: yarn install
