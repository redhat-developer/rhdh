name: "Detect Backstage Bump"
description: "Detects whether a pull request changes the resolved Backstage dependencies"

outputs:
  is_bump:
    description: "True if the PR bumps Backstage packages, or changes the bump checks themselves"
    value: ${{ steps.detect.outputs.is_bump }}

runs:
  using: "composite"
  steps:
    - name: Detect Backstage bump
      id: detect
      shell: bash
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        BASE_COMMIT=$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")
        CHANGED_FILES=$(git diff --name-only "$BASE_COMMIT" "$PR_HEAD_SHA")

        IS_BUMP=false
        if grep -qx 'backstage.json' <<< "$CHANGED_FILES"; then
          echo "backstage.json changed."
          IS_BUMP=true
        elif git diff "$BASE_COMMIT" "$PR_HEAD_SHA" -- yarn.lock | grep -qE '^[+-]  resolution: "@backstage/'; then
          # Covers partial bumps (e.g. security updates) that leave backstage.json alone.
          echo "yarn.lock changes resolved @backstage/* versions."
          IS_BUMP=true
        elif grep -qE '^(scripts/backstage-bump-check/|\.github/actions/detect-backstage-bump/)' <<< "$CHANGED_FILES"; then
          echo "Bump checks changed; running them on this PR."
          IS_BUMP=true
        fi
        echo "is_bump=$IS_BUMP" >> "$GITHUB_OUTPUT"
