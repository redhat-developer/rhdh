apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: registry.redhat.io/rhel9/redis-7:latest
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          env:
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_USERNAME
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              # The RHEL image keeps protected mode on, which rejects remote clients while the
              # default user has no password: disable the default user and allow remote clients.
              # No RDB snapshots: the working dir is not writable and a failed save blocks writes.
              echo "user default off" > /data/redis.conf
              echo "user ${REDIS_USERNAME} on >${REDIS_PASSWORD} allcommands allkeys" >> /data/redis.conf
              redis-server /data/redis.conf \
                --protected-mode no \
                --save "" \
                --tls-port 6379 \
                --port 0 \
                --tls-cert-file /certs/tls.crt \
                --tls-key-file /certs/tls.key \
                --tls-ca-cert-file /certs/ca.crt \
                --tls-auth-clients no
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: redis-data
          emptyDir: {}
        - name: redis-certs
          secret:
            secretName: redis-certs
            defaultMode: 0440
