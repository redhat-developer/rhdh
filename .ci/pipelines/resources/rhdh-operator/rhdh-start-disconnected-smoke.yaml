# Minimal Backstage CR for disconnected operator smoke test.
# Smoke only needs: guest login → homepage. Avoid ConfigMaps/Secrets that the
# normal apply_yaml_files() flow creates (app-config-rhdh, dynamic-plugins-*,
# rhdh-secrets, redis-secret).
#
# flavours: [] disables default flavours (lightspeed) so the deployment does not
# pull/start lightspeed-core / init-rag-data sidecars.
#
# Exact hub image: $HUB_IMAGE is a digest-pinned mirror ref
# (${MIRROR_REGISTRY_URL}/${IMAGE_REPO}@sha256:…). It must match
# CATALOG_INDEX_IMAGE (nightly :next catalog expects local homepage dist from
# the community hub, not GA rhdh-hub-rhel9).
#
# CRD surface: spec.deployment.patch merges containers/initContainers by name
# (K8s strategic merge / operator merge2). That alone is not enough for
# install-dynamic-plugins — DynamicPlugins.getInitContainer() re-applies
# RELATED_IMAGE_backstage after the patch. ocp-disconnected-operator.sh therefore
# sets RELATED_IMAGE_backstage=$HUB_IMAGE on the operator Deployment as well.
#
# CATALOG_INDEX_IMAGE is injected by deploy_rhdh_operator() after
# ocp-disconnected-operator.sh rewrites it to MIRROR_REGISTRY_URL/… (the index
# already mirrored by disconnected::mirror_plugins).
kind: Backstage
apiVersion: rhdh.redhat.com/v1alpha5
metadata:
  name: rhdh
spec:
  flavours: []
  deployment:
    patch:
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: mirror-registry-pull
            containers:
              - name: backstage-backend
                image: "$HUB_IMAGE"
            initContainers:
              - name: install-dynamic-plugins
                image: "$HUB_IMAGE"
  application:
    appConfig:
      configMaps:
        - name: app-config-rhdh-disconnected-smoke
      mountPath: /opt/app-root/src
    extraEnvs:
      envs:
        - name: NODE_OPTIONS
          value: "--no-node-snapshot"
        - name: NODE_ENV
          value: "production"
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
