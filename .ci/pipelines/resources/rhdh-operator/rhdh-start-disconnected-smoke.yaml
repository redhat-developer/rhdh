# Minimal Backstage CR for disconnected operator smoke test.
# Smoke only needs: guest login → homepage. Avoid ConfigMaps/Secrets that the
# normal apply_yaml_files() flow creates (app-config-rhdh, dynamic-plugins-*,
# rhdh-secrets, redis-secret).
#
# flavours: [] disables default flavours (lightspeed) so the deployment does not
# pull/start lightspeed-core / init-rag-data sidecars.
#
# Hub image: leave CSV RELATED_IMAGE_backstage (GA rhdh-hub-rhel9). prepare +
# oc-mirror IDMS rewrites pulls for kubelet — do not patch container images or
# oc set env RELATED_IMAGE (OLM v1 reverts overrides).
#
# CATALOG_INDEX_IMAGE="" clears the operator profile default catalog digest.
# Plain unset is not enough — the hub still extracts its baked-in digest, which
# is not on the mirror (manifest unknown). Empty skips catalog extraction.
# Do not inject plugin-catalog-index:next either: 1.11/next defaults reference
# red-hat-developer-hub-backstage-plugin-homepage, which is missing on Quay
# (RHDHBUGS-3515). Homepage is delivered via OCI dynamic-home-page ConfigMap.
#
# Plugin pulls use registries.conf on install-dynamic-plugins (IDMS does not
# apply to skopeo).
kind: Backstage
apiVersion: rhdh.redhat.com/v1alpha5
metadata:
  name: rhdh
spec:
  flavours: []
  application:
    dynamicPluginsConfigMapName: dynamic-plugins-disconnected-smoke
    appConfig:
      configMaps:
        - name: app-config-rhdh-disconnected-smoke
      mountPath: /opt/app-root/src
    extraEnvs:
      envs:
        - name: NODE_OPTIONS
          value: "--no-node-snapshot"
        - name: NODE_ENV
          value: "production"
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        - name: CATALOG_INDEX_IMAGE
          value: ""
          containers:
            - install-dynamic-plugins
