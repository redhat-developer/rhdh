# Minimal Backstage CR for disconnected operator smoke test.
# Smoke only needs: guest login → homepage. Avoid ConfigMaps/Secrets that the
# normal apply_yaml_files() flow creates (app-config-rhdh, dynamic-plugins-*,
# rhdh-secrets, redis-secret).
#
# flavours: [] disables default flavours (lightspeed) so the deployment does not
# pull/start lightspeed-core / init-rag-data sidecars.
#
# Do NOT patch container images to $IMAGE_REGISTRY/$IMAGE_REPO:$TAG_NAME.
# Nightly defaults are quay.io/rhdh-community/rhdh:next, which prepare/IDMS do
# not mirror (only quay.io/rhdh and registry.redhat.io/rhdh). Leave images to
# the operator CSV defaults (registry.redhat.io/rhdh/rhdh-hub-rhel9@…) so
# ImageDigestMirrorSet from prepare-restricted-environment.sh can rewrite pulls
# to MIRROR_REGISTRY_URL — same hub already mirrored for the operand.
#
# CATALOG_INDEX_IMAGE is injected by deploy_rhdh_operator() after
# ocp-disconnected-operator.sh rewrites it to MIRROR_REGISTRY_URL/… (the index
# already mirrored by disconnected::mirror_plugins). That image provides
# dynamic-plugins.default.yaml — without it, the home-page plugin is missing
# and guest login lands on a / 404 ("We couldn't find that page").
kind: Backstage
apiVersion: rhdh.redhat.com/v1alpha5
metadata:
  name: rhdh
spec:
  flavours: []
  application:
    appConfig:
      configMaps:
        - name: app-config-rhdh-disconnected-smoke
      mountPath: /opt/app-root/src
    extraEnvs:
      envs:
        - name: NODE_OPTIONS
          value: "--no-node-snapshot"
        - name: NODE_ENV
          value: "production"
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
