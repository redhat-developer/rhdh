# Minimal Backstage CR for disconnected operator smoke test.
# Smoke only needs: guest login → homepage. Avoid ConfigMaps/Secrets that the
# normal apply_yaml_files() flow creates (app-config-rhdh, dynamic-plugins-*,
# rhdh-secrets, redis-secret).
#
# flavours: [] disables default flavours (lightspeed) so the deployment does not
# pull/start lightspeed-core / init-rag-data sidecars.
#
# Hub image must match CATALOG_INDEX_IMAGE (both :next for nightly). The :next
# catalog's dynamic-plugins.default.yaml references local
# ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-homepage, which
# exists in quay.io/rhdh-community/rhdh:next but not in the GA CSV hub
# (registry.redhat.io/rhdh/rhdh-hub-rhel9). Helm mirrors the CI hub via
# oc-mirror and sets upstream.backstage.image.registry=MIRROR; operator does
# the same with a skopeo copy + deployment patch to MIRROR_REGISTRY_URL.
#
# Init-container caveat: strategic merge applies this patch by name, and
# backstage-backend keeps the mirrored image. install-dynamic-plugins does not
# stick — DynamicPlugins.getInitContainer() rewrites it to RELATED_IMAGE_backstage
# (CSV GA). ocp-disconnected-operator.sh therefore also sets RELATED_IMAGE_backstage
# on the operator Deployment and post-patches the live Deployment.
#
# CATALOG_INDEX_IMAGE is injected by deploy_rhdh_operator() after
# ocp-disconnected-operator.sh rewrites it to MIRROR_REGISTRY_URL/… (the index
# already mirrored by disconnected::mirror_plugins).
kind: Backstage
apiVersion: rhdh.redhat.com/v1alpha5
metadata:
  name: rhdh
spec:
  flavours: []
  deployment:
    patch:
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: mirror-registry-pull
            containers:
              - name: backstage-backend
                image: "$MIRROR_REGISTRY_URL/$IMAGE_REPO:$TAG_NAME"
            initContainers:
              - name: install-dynamic-plugins
                image: "$MIRROR_REGISTRY_URL/$IMAGE_REPO:$TAG_NAME"
  application:
    appConfig:
      configMaps:
        - name: app-config-rhdh-disconnected-smoke
      mountPath: /opt/app-root/src
    extraEnvs:
      envs:
        - name: NODE_OPTIONS
          value: "--no-node-snapshot"
        - name: NODE_ENV
          value: "production"
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
