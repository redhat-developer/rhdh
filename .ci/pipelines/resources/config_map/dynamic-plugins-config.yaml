    # Nested sidebar menu groups (e.g. "References" > APIs/Learning Paths, "Favorites" >
    # Docs) have no NFS equivalent: the app's sidebar
    # (packages/app/src/modules/nav/Sidebar.tsx) is a fixed, code-defined
    # NavContentBlueprint (Search / Menu / Settings groups, with Catalog and Create
    # pinned and everything else flat, sorted by title) — it does not read menuItems
    # config at all. See sidebar.spec.ts for the flat-nav assertions this drives
    # instead.
dynamicPlugins:
  rootDirectory: dynamic-plugins-root
