# RHDH serves the Backstage new frontend system (packages/app) by default, which reads
# `app.extensions` below. See docs/dynamic-plugins/migrating-config-to-new-frontend-system.md
# for the full OFS -> NFS config mapping and known RHDH-specific gaps.
app:
  extensions:
    # Homepage 3.1 owns page:homepage and its layout. Keep community home for visits,
    # but disable its page so only one Home destination is registered.
    - page:home: false
    - page:homepage:
        config:
          path: /
          title: Home
    - api:home/visits: true
    - app-root-element:home/visit-listener: true
    - translation:app/homepage-translations
    # Global header: wrapper + translations attach to the core `app` plugin and must be
    # explicitly enabled. The plugin's own NFS extensions (gh-component:global-header/*,
    # gh-menu-item:global-header/*) are enabled by default — no pluginConfig needed.
    - app-root-wrapper:app/global-header
    - translation:app/global-header-translations
    # NFS AppLanguageApi reads availableLanguages here — not from i18n.locales in
    # app-config-rhdh.yaml. Without this, UserSettingsLanguageToggle hides itself
    # (languages.length <= 1).
    - api:app/app-language:
        config:
          availableLanguages: [en, de, es, fr, it, ja]
          defaultLanguage: en
    # Backstage 1.54 added home-page-widget:search/search-bar on @backstage/plugin-search.
    # The RHDH homepage plugin already provides home-page-widget:homepage/search-bar; leaving
    # both enabled duplicates the Search input and fails guest-signin-happy-path.spec.ts.
    - home-page-widget:search/search-bar: false
    # customizable: false so `priority` actually governs ordering (with customizable:
    # true, the layout extension keeps the plugin-registration order and ignores
    # priority entirely). Keys match each widget's `params.name` — see
    # rhdh-plugins/workspaces/homepage/plugins/homepage/src/extensions/homePageCards.tsx.
    # Breakpoints mirror app-config.local.yaml so the default NFS widgets render in a
    # stable layout for home-page-customization.spec.ts and guest-signin-happy-path.spec.ts.
    - home-page-layout:homepage/dynamic-homepage-layout:
        config:
          customizable: false
          widgetLayout:
            "Red Hat Developer Hub - Explore templates":
              priority: 300
              breakpoints:
                xl:
                  w: 12
                  h: 5
                lg:
                  w: 12
                  h: 5
                md:
                  w: 12
                  h: 5
                sm:
                  w: 12
                  h: 5
                xs:
                  w: 12
                  h: 7.5
                xxs:
                  w: 12
                  h: 13.5
            "Red Hat Developer Hub - Software Catalog":
              priority: 200
