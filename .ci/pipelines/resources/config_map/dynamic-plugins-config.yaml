                xl:
                  w: 12
                  h: 7
                lg:
                  w: 12
                  h: 7
                md:
                  w: 12
                  h: 8
                sm:
                  w: 12
                  h: 9
                xs:
                  w: 12
                  h: 11
                xxs:
                  w: 12
                  h: 15
            "Red Hat Developer Hub - Onboarding":
