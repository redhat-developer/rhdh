    # Sidebar navigation is provided by the app-defaults dynamic plugin. E2E coverage
    # verifies the user-facing Docs and Learning Paths destinations in sidebar.spec.ts.
    # The runtime catalog-graph API (app-defaults plugin override) does not know the
    # scaffolder-relation-processor pair, so the Overview "Relations" card drops the
    # scaffoldedFrom edge. Set relations and pairs on the card directly
    # (scaffolder-relation-processor.spec.ts asserts the merged label).
    - entity-card:catalog-graph/relations:
        config:
          relations:
            - apiConsumedBy
            - apiProvidedBy
            - childOf
            - consumesApi
            - dependencyOf
            - dependsOn
            - hasMember
            - hasPart
            - memberOf
            - ownedBy
            - ownerOf
            - parentOf
            - partOf
            - providesApi
            - scaffoldedFrom
            - scaffolderOf
          relationPairs:
            - [ownerOf, ownedBy]
            - [consumesApi, apiConsumedBy]
            - [apiProvidedBy, providesApi]
            - [hasPart, partOf]
            - [parentOf, childOf]
            - [hasMember, memberOf]
            - [dependsOn, dependencyOf]
            - [scaffolderOf, scaffoldedFrom]
# The catalog defaults expose only the three main sections. The backend-enabled
# CI fixture also needs these cards for homepage customization and Guest tests.
# Refs match home-page-widget:homepage/<ref>; no persona conditions hide them.
homepage:
  defaultWidgets:
    - id: rhdh-onboarding-section
      ref: rhdh-onboarding-section
    - id: rhdh-entity-section
      ref: rhdh-entity-section
    - id: rhdh-template-section
      ref: rhdh-template-section
    - id: quickaccess-card
      ref: quickaccess-card
    - id: search-bar
      ref: search-bar
    - id: featured-docs-card
      ref: featured-docs-card
    - id: catalog-starred-entities-card
      ref: catalog-starred-entities-card
    - id: recently-visited-card
      ref: recently-visited-card
    - id: top-visited-card
      ref: top-visited-card
dynamicPlugins:
  rootDirectory: dynamic-plugins-root
