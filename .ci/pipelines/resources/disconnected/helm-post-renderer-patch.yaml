# Disconnected Helm post-renderer patch (merged with yq by helm-post-renderer.sh).
# Rendered via envsubst (requires MIRROR_REGISTRY_URL) into the volumes and the
# install-dynamic-plugins initContainer volumeMounts of the RHDH Deployment.
#
# Kept as a data-only fragment (not a full pod spec) so yq appends these to the
# chart's existing arrays instead of replacing them — avoiding the Helm "array
# clobber" pitfall a values-file override would cause.
volumes:
  - name: rhdh-plugin-mirror-conf
    configMap:
      name: rhdh-plugin-mirror-conf
  - name: mirror-registry-ca
    configMap:
      name: mirror-registry-ca
volumeMounts:
  - mountPath: /etc/containers/registries.conf.d/rhdh-registries.conf
    name: rhdh-plugin-mirror-conf
    readOnly: true
    subPath: rhdh-registries.conf
  - mountPath: /etc/containers/policy.json
    name: rhdh-plugin-mirror-conf
    readOnly: true
    subPath: policy.json
  - mountPath: /etc/containers/certs.d/${MIRROR_REGISTRY_URL}/ca.crt
    name: mirror-registry-ca
    readOnly: true
    subPath: ca.crt
