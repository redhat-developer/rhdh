# Disconnected smoke: homepage-only dynamic plugins (Operator ConfigMap).
# ref:// is resolved through the mirrored catalog index (CATALOG_INDEX_IMAGE).
#
# includes: [] prevents merging dynamic-plugins.default.yaml from the catalog
# index. next catalogs can list :tag refs that were not mirrored (digest-only
# mirror), which CrashLoops install-dynamic-plugins.
includes: []
plugins:
  - package: ref://red-hat-developer-hub-backstage-plugin-homepage
    enabled: true
    pluginConfig:
      dynamicPlugins:
        frontend:
          red-hat-developer-hub.backstage-plugin-homepage:
            dynamicRoutes:
              - path: /
                importName: DynamicHomePage
