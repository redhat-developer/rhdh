# This file is for AKS installation only.
# It is applied by `helm upgrade` after the `values-showcase.yaml` is applied and only contains complementary differences for AKS.
# Note, that it overwrites the whole key that is present in this file.
# The only exception is dynamicPlugins.plugins, that gets merged with the base file.
openshift:
  route:
    enabled: false
dynamicPlugins:
  plugins:
    - package: ref://backstage-community-plugin-catalog-backend-module-scaffolder-relation-processor
      enabled: true
extraEnvFrom:
  - secretRef:
      name: rhdh-secrets
podSecurityContext:
  fsGroup: 3000
startupProbe:
  failureThreshold: 10 # Override the default to account for longer startup time on Kubernetes.
# Tolerations and affinity needed to be scheduled on a spot AKS cluster
tolerations:
  - key: "kubernetes.azure.com/scalesetpriority"
    operator: "Equal"
    value: "spot"
    effect: "NoSchedule"
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
            - key: "kubernetes.azure.com/scalesetpriority"
              operator: In
              values:
                - "spot"
postgresql:
  primary:
    podSecurityContext:
      enabled: true
      fsGroup: 3000
    # Tolerations and affinity needed to be scheduled on a spot AKS cluster. Only `postgresql` require it.
    tolerations:
      - key: "kubernetes.azure.com/scalesetpriority"
        operator: "Equal"
        value: "spot"
        effect: "NoSchedule"
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
                - key: "kubernetes.azure.com/scalesetpriority"
                  operator: In
                  values:
                    - "spot"
  volumePermissions:
    enabled: false
ingress:
  enabled: true
  className: webapprouting.kubernetes.azure.com
  # AKS uses the load balancer IP as the app URL; Ingress rules cannot use an IP as host.
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: ImplementationSpecific
