# This file is for AKS installation only.
# It is applied by `helm upgrade` after the `values-showcase-rbac.yaml` is applied and only contains complementary differences for AKS.
# Note, that it overwrites the whole key that is present in this file.
# The only exception is dynamicPlugins.plugins, that gets merged with the base file.
openshift:
  route:
    enabled: false
# The base config points ssl at Crunchy certs that are not mounted here, and the
# bundled Fedora postgres has no TLS. The merge drops null keys, removing ssl.
appConfig:
  backend:
    database:
      connection:
        ssl: null
extraEnv:
  - name: SEGMENT_TEST_MODE
    value: "true"
  - name: NODE_TLS_REJECT_UNAUTHORIZED
    value: "0"
  - name: NODE_ENV
    value: "production"
  - name: ENABLE_CORE_ROOTHTTPROUTER_OVERRIDE
    value: "true"
extraEnvFrom:
  - secretRef:
      name: rhdh-secrets
extraVolumeMounts:
  - name: rbac-policy
    mountPath: /opt/app-root/src/rbac
extraVolumes:
  - name: rbac-policy
    configMap:
      defaultMode: 420
      name: rbac-policy
podSecurityContext:
  fsGroup: 3000
startupProbe:
  failureThreshold: 10 # Override the default to account for longer startup time on Kubernetes.
# Tolerations and affinity needed to be scheduled on a spot AKS cluster
tolerations:
  - key: "kubernetes.azure.com/scalesetpriority"
    operator: "Equal"
    value: "spot"
    effect: "NoSchedule"
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
            - key: "kubernetes.azure.com/scalesetpriority"
              operator: In
              values:
                - "spot"
postgresql:
  enabled: true
  postgresqlDataDir: /var/lib/pgsql/data/userdata
  auth:
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
    existingSecret: null
  primary:
    securityContext:
      enabled: false
    podSecurityContext:
      enabled: true
      fsGroup: 3000
    containerSecurityContext:
      enabled: false
    persistence:
      enabled: true
      size: 1Gi
      mountPath: /var/lib/pgsql/data
    extraEnvVars:
      - name: POSTGRESQL_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            key: postgres-password
            name: "{{ .Release.Name }}-postgresql"
    # Tolerations and affinity needed to be scheduled on a spot AKS cluster. Only `postgresql` require it.
    tolerations:
      - key: "kubernetes.azure.com/scalesetpriority"
        operator: "Equal"
        value: "spot"
        effect: "NoSchedule"
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
                - key: "kubernetes.azure.com/scalesetpriority"
                  operator: In
                  values:
                    - "spot"
  volumePermissions:
    enabled: false
ingress:
  enabled: true
  className: webapprouting.kubernetes.azure.com
  # AKS uses the load balancer IP as the app URL; Ingress rules cannot use an IP as host.
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: ImplementationSpecific
