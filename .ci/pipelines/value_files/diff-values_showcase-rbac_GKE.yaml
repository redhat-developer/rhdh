# This file is for GKE installation only.
# It is applied by `helm upgrade` after the `values-showcase-rbac.yaml` is applied and only contains complementary differences for GKE.
# Note, that it overwrites the whole key that is present in this file.
# The only exception is dynamicPlugins.plugins, that gets merged with the base file.
openshift:
  route:
    enabled: false
# The base config points ssl at Crunchy certs that are not mounted here, and the
# bundled Fedora postgres has no TLS. The merge drops null keys, removing ssl.
appConfig:
  backend:
    database:
      connection:
        ssl: null
extraEnv:
  - name: SEGMENT_TEST_MODE
    value: "true"
  - name: NODE_TLS_REJECT_UNAUTHORIZED
    value: "0"
  - name: NODE_ENV
    value: "production"
  - name: ENABLE_CORE_ROOTHTTPROUTER_OVERRIDE
    value: "true"
extraEnvFrom:
  - secretRef:
      name: rhdh-secrets
extraVolumeMounts:
  - name: rbac-policy
    mountPath: /opt/app-root/src/rbac
extraVolumes:
  - name: rbac-policy
    configMap:
      defaultMode: 420
      name: rbac-policy
podSecurityContext:
  fsGroup: 2000
startupProbe:
  failureThreshold: 10 # Override the default to account for longer startup time on Kubernetes.
postgresql:
  enabled: true
  postgresqlDataDir: /var/lib/pgsql/data/userdata
  auth:
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
    existingSecret: null
  primary:
    securityContext:
      enabled: false
    podSecurityContext:
      enabled: true
      fsGroup: 3000
    containerSecurityContext:
      enabled: false
    persistence:
      enabled: true
      size: 1Gi
      mountPath: /var/lib/pgsql/data
    extraEnvVars:
      - name: POSTGRESQL_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            key: postgres-password
            name: "{{ .Release.Name }}-postgresql"
  volumePermissions:
    enabled: false
service:
  type: NodePort
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: rhdh-static-ip
    ingress.gcp.kubernetes.io/pre-shared-cert: ""
    networking.gke.io/v1beta1.FrontendConfig: rhdh-gke-ingress-security-config
  className: gce
