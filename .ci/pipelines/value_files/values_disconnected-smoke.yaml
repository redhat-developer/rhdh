# Minimal Helm values for disconnected smoke test.
# The smoke test only verifies: login page renders → guest login → homepage.
# No GitHub integrations, external secrets, or OIDC needed.
# All optional features (lightspeed, orchestrator) are disabled to avoid
# pulling extra images and referencing missing ConfigMaps/Secrets.
#
# Do not include dynamic-plugins.default.yaml from the catalog index: next
# catalogs can list :tag refs that do not exist on quay (manifest unknown),
# which CrashLoops install-dynamic-plugins after registries.conf rewrites
# those pulls to the mirror. Homepage package is HOMEPAGE_PLUGIN_PACKAGE
# (digest-pinned OCI from the catalog). ref:// needs includes and cannot be used.
# The chart replaces Bitnami's PostgreSQL image with Red Hat's; the Bitnami common
# chart refuses unrecognized images unless this flag is set (bitnami/charts#30850).
global:
  security:
    allowInsecureImages: true
dynamicPlugins:
  includes: []
  plugins:
    - package: ${HOMEPAGE_PLUGIN_PACKAGE}
      enabled: true
      pluginConfig:
        dynamicPlugins:
          frontend:
            red-hat-developer-hub.backstage-plugin-homepage:
              dynamicRoutes:
                - path: /
                  importName: DynamicHomePage
intelligentAssistant:
  enabled: false
orchestrator:
  enabled: false
image:
  pullPolicy: Always
appConfig:
  auth:
    environment: development
    providers:
      guest:
        dangerouslyAllowOutsideDevelopment: true
