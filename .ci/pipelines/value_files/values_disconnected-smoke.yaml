# Minimal Helm values for disconnected smoke test.
# The smoke test only verifies: login page renders → guest login → homepage.
# No GitHub integrations, external secrets, or OIDC needed.
# All optional features (lightspeed, orchestrator) are disabled to avoid
# pulling extra images and referencing missing ConfigMaps/Secrets.
#
# Do not include dynamic-plugins.default.yaml from the catalog index: next
# catalogs can list :tag refs that do not exist on quay (manifest unknown),
# which CrashLoops install-dynamic-plugins after registries.conf rewrites
# those pulls to the mirror. Every package below is a digest-pinned OCI from
# the catalog. ref:// needs includes and cannot be used.
#
# The 2.x New Frontend System hub serves the sign-in page (app-auth), sidebar
# (app-defaults), SCM integrations (app-integrations) and guest auth provider
# as dynamic plugins, so they are installed next to the homepage.
# Pins the chart fullname (<release>-developer-hub). The disconnected job creates
# the registry-auth secret and the backend egress NetworkPolicy for that name.
nameOverride: developer-hub
dynamicPlugins:
  includes: []
  plugins:
    - package: ${APP_AUTH_PLUGIN_PACKAGE}
      enabled: true
    - package: ${APP_DEFAULTS_PLUGIN_PACKAGE}
      enabled: true
    - package: ${APP_INTEGRATIONS_PLUGIN_PACKAGE}
      enabled: true
    - package: ${GUEST_PROVIDER_PLUGIN_PACKAGE}
      enabled: true
    - package: ${HOMEPAGE_PLUGIN_PACKAGE}
      enabled: true
intelligentAssistant:
  enabled: false
orchestrator:
  enabled: false
# The chart replaces Bitnami's PostgreSQL image with Red Hat's; the Bitnami common
# chart refuses unrecognized images unless this flag is set (bitnami/charts#30850).
global:
  security:
    allowInsecureImages: true
image:
  pullPolicy: Always
appConfig:
  auth:
    environment: development
    providers:
      guest:
        dangerouslyAllowOutsideDevelopment: true
  # app-auth does not inject the Guest provider (auth.providers is not
  # frontend-visible), so the provider list must be explicit.
  signInPage: guest
  app:
    # New Frontend System: the homepage plugin owns page:homepage and its
    # layout; disable the community home page so only one Home destination is
    # registered. Mirrors resources/config_map/dynamic-plugins-config.yaml.
    extensions:
      - page:home: false
      - page:homepage:
          config:
            path: /
            title: Home
      - translation:app/homepage-translations
