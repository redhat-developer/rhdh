# Example dynamic-plugins set for a typical RHDH NFS (app-next) local experience.
#
# Install into dynamic-plugins-root (from the repo root), then start with
# `yarn workspace backend start:next`:
#
#   cp packages/app-next/dynamic-plugins.example.yaml dynamic-plugins.yaml
#   npx -y @red-hat-developer-hub/cli-module-install-dynamic-plugins@0.2.0 \
#     install dynamic-plugins-root
#
# Or merge the `plugins:` entries into your own dynamic-plugins.yaml / Helm
# `global.dynamic.plugins` values. See also e2e-tests/local-harness/populate.sh.
#
# Sign-in comes from app-auth (not a static module in app-next), so it stays
# swappable. Pair with app-integrations when you need default SCM auth APIs.
#
# The commented entries under "Additional packages.enabled" mirror the enabled
# list in rhdh-plugin-export-overlays/default.packages.yaml — uncomment as needed.
#
# NOTE: Overlay tags below track published OCI builds and may lag the Backstage
# version in this repo. Prefer matching `bs_<backstage>__<plugin>` tags when
# available; otherwise use the newest published tag for each package.

plugins:
  # --- Minimal NFS shell UX (enabled by default in this example) ---

  # RHDH multi-provider sign-in page + OIDC/Auth0/SAML frontend APIs
  # Tags from rhdh-plugin-export-overlays/workspaces/*/metadata (main / BS 1.52.0).
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-app-auth:bs_1.52.0__0.1.0!red-hat-developer-hub-backstage-plugin-app-auth
    disabled: false

  # Default SCM integrations / scmAuth wiring (github, gitlab, azure, bitbucket)
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-app-integrations:bs_1.52.0__0.1.0!red-hat-developer-hub-backstage-plugin-app-integrations
    disabled: false

  # App drawer host (appDefaultsModule / pluginId app). Replaces a static
  # @red-hat-developer-hub/backstage-plugin-app-react dependency.
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-app-defaults:bs_1.52.0__0.0.2!red-hat-developer-hub-backstage-plugin-app-defaults
    disabled: false

  # RHDH theme — npm/OCI 1.0.1+ ship NFS FrontendModule on `.` (./alpha removed;
  # OFS helpers live at ./legacy). No app-config themes block needed for NFS.
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-theme:bs_1.52.0__1.0.1!red-hat-developer-hub-backstage-plugin-theme
    disabled: false

  # Homepage — NFS `alpha` (homePageModule). Shell keeps @backstage/plugin-home
  # until rhdh-plugins#4032 embeds homePagePlugin in the overlay default.
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-homepage:bs_1.52.0__1.17.0!red-hat-developer-hub-backstage-plugin-homepage
    disabled: false
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-homepage-backend:bs_1.52.0__0.4.0!red-hat-developer-hub-backstage-plugin-homepage-backend
    disabled: false

  # Global header (@red-hat-developer-hub/backstage-plugin-global-header)
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-global-header:bs_1.52.0__1.22.0!red-hat-developer-hub-backstage-plugin-global-header
    disabled: false

  # Quickstart drawer + help menu item (@red-hat-developer-hub/backstage-plugin-quickstart)
  # Note: bs_1.52.0__1.12.2 does not yet include RHDHBUGS-3489 (forwardRef on
  # QuickstartHelpMenuItem). With global-header 1.22.x the help-menu item can be
  # non-clickable until overlays picks up rhdh-plugins e9c3e9e13 / a newer QS tag.
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-quickstart:bs_1.52.0__1.12.2!red-hat-developer-hub-backstage-plugin-quickstart
    disabled: false

  # --- Additional packages.enabled (from default.packages.yaml) ---
  # Uncomment entries you need. Source:
